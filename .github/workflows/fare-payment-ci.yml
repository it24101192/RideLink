name: Fare & Payment Service CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: fare-payment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fare-payment:
    name: Java 21 · lint, tests, coverage, build
    runs-on: ubuntu-latest
    env:
      FARE_DB_URL: ${{ secrets.FARE_DB_URL }}
      FARE_DB_USERNAME: ${{ secrets.FARE_DB_USERNAME }}
      FARE_DB_PASSWORD: ${{ secrets.FARE_DB_PASSWORD }}
      FARE_JWT_SECRET: ${{ secrets.FARE_JWT_SECRET }}
      RIDE_SERVICE_URL: ${{ secrets.RIDE_SERVICE_URL }}
      MESSAGE_BROKER_URL: file:/tmp/ridelink-ci-events.jsonl
      MESSAGE_BROKER_TYPE: file
      PAYMENT_TEST_MODE: "true"
      PAYMENT_TEST_OUTCOME_SUCCESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: bash account-service/gradlew -p fare-payment-service checkstyleMain checkstyleTest

      - name: Run unit tests
        run: bash account-service/gradlew -p fare-payment-service test

      - name: Run API integration tests
        run: bash account-service/gradlew -p fare-payment-service integrationTest

      - name: Build coverage report
        run: bash account-service/gradlew -p fare-payment-service jacocoTestReport

      - name: Build service
        run: bash account-service/gradlew -p fare-payment-service build

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-payment-coverage-and-tests
          path: |
            fare-payment-service/build/reports/jacoco/test/
            fare-payment-service/build/reports/tests/test/
            fare-payment-service/build/reports/tests/integrationTest/
          if-no-files-found: warn
          retention-days: 14
