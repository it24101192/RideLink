name: RideLink Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ridelink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-services:
    name: ${{ matrix.service }} - Java 21
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-management-service
          - fare-payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build service
        run: bash "${{ matrix.service }}/gradlew" -p "${{ matrix.service }}" clean build
      - name: Build Fare & Payment coverage report
        if: matrix.service == 'fare-payment-service'
        run: bash fare-payment-service/gradlew -p fare-payment-service jacocoTestReport
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-reports
          path: |
            ${{ matrix.service }}/build/reports/tests/
            ${{ matrix.service }}/build/reports/jacoco/
          if-no-files-found: warn
          retention-days: 14

  javascript-utilities:
    name: Ride JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ride-management-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ride-management-service/package-lock.json
      - run: npm ci
      - run: npm run test:js

  smoke-script:
    name: PowerShell smoke script checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline smoke script tests
        shell: powershell
        run: .\tests\e2e-smoke-test.tests.ps1
