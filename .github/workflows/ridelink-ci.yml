name: RideLink Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ridelink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-service:
    name: Account Service · Java 21
    runs-on: ubuntu-latest
    env:
      RIDELINK_DB_PASSWORD: ${{ secrets.RIDELINK_DB_PASSWORD }}
      RIDELINK_JWT_SECRET: ${{ secrets.RIDELINK_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build Account Service
        run: bash account-service/gradlew -p account-service clean test build

  fare-payment-service:
    name: Fare & Payment Service · Java 21
    runs-on: ubuntu-latest
    env:
      FARE_DB_URL: ${{ secrets.FARE_DB_URL }}
      FARE_DB_USERNAME: ${{ secrets.FARE_DB_USERNAME }}
      FARE_DB_PASSWORD: ${{ secrets.FARE_DB_PASSWORD }}
      FARE_JWT_SECRET: ${{ secrets.FARE_JWT_SECRET }}
      RIDE_SERVICE_URL: ${{ secrets.RIDE_SERVICE_URL }}
      MESSAGE_BROKER_URL: file:/tmp/ridelink-ci-events.jsonl
      MESSAGE_BROKER_TYPE: file
      PAYMENT_TEST_MODE: "true"
      PAYMENT_TEST_OUTCOME_SUCCESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, test, cover, and build Fare & Payment Service
        run: bash account-service/gradlew -p fare-payment-service clean checkstyleMain checkstyleTest test integrationTest jacocoTestReport build

      - name: Upload combined Fare & Payment coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridelink-fare-payment-coverage
          path: fare-payment-service/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 14
