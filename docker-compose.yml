services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ridelink-local}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -uroot --execute "SELECT 1" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  ride-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridelink_ride_db
      POSTGRES_USER: ridelink
      POSTGRES_PASSWORD: ${RIDE_DB_PASSWORD:-ridelink-local}
    ports:
      - "5432:5432"
    volumes:
      - ride-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridelink -d ridelink_ride_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ridelink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ridelink-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  account-service:
    build: ./account-service
    environment:
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ACCOUNT_DB_URL: jdbc:mysql://mysql:3306/ridelink_account_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ACCOUNT_DB_USERNAME: root
      ACCOUNT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ridelink-local}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy

  driver-vehicle-service:
    build: ./driver-vehicle-service
    environment:
      SERVER_PORT: 3002
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      DRIVER_DB_URL: jdbc:mysql://mysql:3306/ridelink_driver_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DRIVER_DB_USERNAME: root
      DRIVER_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ridelink-local}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:3002/health"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy

  fare-payment-service:
    build: ./fare-payment-service
    environment:
      SERVER_PORT: 3004
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FARE_DB_URL: jdbc:mysql://mysql:3306/ridelink_fare_db
      FARE_DB_USERNAME: root
      FARE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ridelink-local}
      RIDE_SERVICE_URL: ${RIDE_SERVICE_URL:-http://ride-management-service:3003}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ridelink}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ridelink-local}
      RIDE_EVENTS_EXCHANGE: ${RIDE_EVENTS_EXCHANGE:-ridelink.events}
      RIDE_COMPLETED_ROUTING_KEY: ${RIDE_COMPLETED_ROUTING_KEY:-ride.completed}
      RIDE_COMPLETED_QUEUE: ${RIDE_COMPLETED_QUEUE:-fare-payment.ride-completed}
      RIDE_EVENTS_DEAD_LETTER_EXCHANGE: ${RIDE_EVENTS_DEAD_LETTER_EXCHANGE:-ridelink.events.dlx}
      RIDE_COMPLETED_DEAD_LETTER_QUEUE: ${RIDE_COMPLETED_DEAD_LETTER_QUEUE:-fare-payment.ride-completed.dlq}
      PAYMENT_TEST_MODE: ${PAYMENT_TEST_MODE:-true}
      PAYMENT_TEST_OUTCOME_SUCCESS: ${PAYMENT_TEST_OUTCOME_SUCCESS:-true}
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:3004/health"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ride-management-service:
        condition: service_healthy

  ride-management-service:
    build: ./ride-management-service
    environment:
      SERVER_PORT: 3003
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      RIDE_DB_URL: jdbc:postgresql://ride-postgres:5432/ridelink_ride_db
      RIDE_DB_USERNAME: ridelink
      RIDE_DB_PASSWORD: ${RIDE_DB_PASSWORD:-ridelink-local}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL:-http://account-service:8081}
      DRIVER_SERVICE_URL: ${DRIVER_SERVICE_URL:-http://driver-vehicle-service:3002}
      FARE_PAYMENT_SERVICE_URL: ${FARE_PAYMENT_SERVICE_URL:-http://fare-payment-service:3004}
      DRIVER_SEARCH_RADIUS_KM: ${DRIVER_SEARCH_RADIUS_KM:-10}
      RIDE_EVENTS_PUBLISH_INTERVAL_MS: ${RIDE_EVENTS_PUBLISH_INTERVAL_MS:-1000}
      DRIVER_SERVICE_AREA_CHECK: ${DRIVER_SERVICE_AREA_CHECK:-false}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ridelink}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ridelink-local}
      RIDE_EVENTS_EXCHANGE: ${RIDE_EVENTS_EXCHANGE:-ridelink.events}
      RIDE_COMPLETED_ROUTING_KEY: ${RIDE_COMPLETED_ROUTING_KEY:-ride.completed}
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:3003/health"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      ride-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_healthy
      driver-vehicle-service:
        condition: service_healthy

volumes:
  mysql-data:
  ride-postgres-data:
  rabbitmq-data:
