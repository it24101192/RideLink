spring.application.name=account-service
# Ride Management Service expects Account Service on 8081 (ACCOUNT_SERVICE_URL default)
server.port=${SERVER_PORT:8081}

spring.datasource.url=${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/ridelink_account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ACCOUNT_DB_USERNAME:root}
spring.datasource.password=${RIDELINK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Must be the same value as RIDE_JWT_SECRET / FARE_JWT_SECRET (they default to RIDELINK_JWT_SECRET)
jwt.secret=${RIDELINK_JWT_SECRET}
