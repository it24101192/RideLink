spring.application.name=account-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/ridelink_account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ACCOUNT_DB_USERNAME:root}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:${RIDELINK_DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:${RIDELINK_JWT_SECRET}}
app.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
