spring.application.name=fare-payment-service
server.port=${SERVER_PORT:3004}

spring.datasource.url=${FARE_DB_URL:jdbc:mysql://localhost:3306/ridelink_fare_db}
spring.datasource.username=${FARE_DB_USERNAME:root}
spring.datasource.password=${FARE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
ride.service.url=${RIDE_SERVICE_URL:http://localhost:3003}
ride.service.connect-timeout=2s
ride.service.read-timeout=3s
ride.service.retry-count=2
ride.service.retry-delay=100ms
ride.service.client.enabled=true
message.broker.url=${MESSAGE_BROKER_URL:file:/tmp/ridelink-events.jsonl}
message.broker.type=${MESSAGE_BROKER_TYPE:file}
payment.test-mode=${PAYMENT_TEST_MODE:false}
payment.test-outcome-success=${PAYMENT_TEST_OUTCOME_SUCCESS:true}

# Validate shared HMAC-signed Account Service JWTs.
security.jwt.secret=${FARE_JWT_SECRET:${RIDELINK_JWT_SECRET}}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/api-docs

logging.level.org.springframework.security=DEBUG