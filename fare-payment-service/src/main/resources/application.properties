spring.application.name=fare-payment-service
server.port=${SERVER_PORT:3004}

spring.datasource.url=${FARE_DB_URL:jdbc:mysql://localhost:3306/ridelink_fare_db}
spring.datasource.username=${FARE_DB_USERNAME:root}
spring.datasource.password=${FARE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
ride.service.url=${RIDE_SERVICE_URL:http://localhost:3003}
ride.service.connect-timeout=2s
ride.service.read-timeout=3s
ride.service.retry-count=2
ride.service.retry-delay=100ms
ride.service.client.enabled=true
message.broker.type=rabbit
payment.test-mode=${PAYMENT_TEST_MODE:false}
payment.test-outcome-success=${PAYMENT_TEST_OUTCOME_SUCCESS:true}

# Validate shared HMAC-signed Account Service JWTs.
security.jwt.secret=${JWT_SECRET:${FARE_JWT_SECRET:${RIDELINK_JWT_SECRET}}}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
ride.events.exchange=${RIDE_EVENTS_EXCHANGE:ridelink.events}
ride.events.queue=${RIDE_COMPLETED_QUEUE:fare-payment.ride-completed}
ride.events.routing-key=${RIDE_COMPLETED_ROUTING_KEY:ride.completed}
ride.events.dead-letter-exchange=${RIDE_EVENTS_DEAD_LETTER_EXCHANGE:ridelink.events.dlx}
ride.events.dead-letter-queue=${RIDE_COMPLETED_DEAD_LETTER_QUEUE:fare-payment.ride-completed.dlq}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/api-docs

logging.level.org.springframework.security=DEBUG
