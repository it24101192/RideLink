# Ride Management Service expects Driver Service on 3002 (DRIVER_SERVICE_URL default)
server.port=${SERVER_PORT:3002}
spring.application.name=driver-vehicle-service

# MySQL Database Configuration (MySQL Workbench / Local MySQL)
spring.datasource.url=${DRIVER_DB_URL:jdbc:mysql://localhost:3306/ridelink_driver_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DRIVER_DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${RIDELINK_DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.com.ridelink.drivervehicle=INFO
