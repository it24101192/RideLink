spring.application.name=ride-management-service
server.port=${SERVER_PORT:3003}
spring.datasource.url=${RIDE_DB_URL:jdbc:postgresql://localhost:5432/ridelink_ride_db}
spring.datasource.username=${RIDE_DB_USERNAME:ridelink}
spring.datasource.password=${RIDE_DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${JWT_SECRET:${RIDE_JWT_SECRET:${RIDELINK_JWT_SECRET}}}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
account.service.connect-timeout=2s
account.service.read-timeout=3s
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:3002}
driver.service.connect-timeout=2s
driver.service.read-timeout=3s
driver.search.radius-km=${DRIVER_SEARCH_RADIUS_KM:10}
driver.service-area-check=${DRIVER_SERVICE_AREA_CHECK:false}
fare.payment.service.url=${FARE_PAYMENT_SERVICE_URL:http://localhost:3004}
fare.payment.service.connect-timeout=2s
fare.payment.service.read-timeout=3s
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
ride.events.exchange=${RIDE_EVENTS_EXCHANGE:ridelink.events}
ride.events.routing-key=${RIDE_COMPLETED_ROUTING_KEY:ride.completed}
ride.events.publish-interval-ms=${RIDE_EVENTS_PUBLISH_INTERVAL_MS:1000}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.url=/openapi.yaml
