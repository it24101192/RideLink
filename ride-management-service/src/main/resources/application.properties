spring.application.name=ride-management-service
server.port=8083

# ---- MySQL (own database - do not share with other services) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ride_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Interservice URLs ----
services.driver-service.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
services.fare-payment-service.base-url=${FARE_PAYMENT_SERVICE_URL:http://localhost:8084}
services.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# ---- OpenAPI / Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
