spring.application.name=ride-management-service
server.port=${SERVER_PORT:3003}
spring.datasource.url=${RIDE_DB_URL:jdbc:postgresql://localhost:5432/ridelink_ride_db}
spring.datasource.username=${RIDE_DB_USERNAME:ridelink}
spring.datasource.password=${RIDE_DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${RIDE_JWT_SECRET:${RIDELINK_JWT_SECRET}}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
account.service.connect-timeout=2s
account.service.read-timeout=3s
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:3002}
driver.service.connect-timeout=2s
driver.service.read-timeout=3s
driver.search.radius-km=${DRIVER_SEARCH_RADIUS_KM:10}
driver.service-area-check=${DRIVER_SERVICE_AREA_CHECK:false}
message.broker.type=${MESSAGE_BROKER_TYPE:file}
message.broker.url=${MESSAGE_BROKER_URL:file:/tmp/ridelink-events.jsonl}
payment.test-mode=${PAYMENT_TEST_MODE:false}
payment.test-outcome-success=${PAYMENT_TEST_OUTCOME_SUCCESS:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.url=/openapi.yaml
