name: Ride Management Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ride-management-service/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ride-management-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ride_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: ride-management-service
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ci-test-secret-value
        run: mvn -B clean verify
