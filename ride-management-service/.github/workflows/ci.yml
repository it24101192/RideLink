name: Ride Management Service CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  javascript-utilities:
    name: Node 20 JavaScript unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ride-management-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ride-management-service/package.json
      - name: Install JavaScript dependencies
        run: npm install
      - name: Run Jest tests
        run: npm run test:js

  ride-management:
    name: Java 21 · lint, tests, coverage, build
    runs-on: ubuntu-latest
    env:
      RIDE_DB_URL: jdbc:postgresql://localhost:5432/ridelink_ride_db
      RIDE_DB_USERNAME: ridelink
      RIDE_DB_PASSWORD: ci-only-not-used-by-unit-tests
      RIDE_JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, test, coverage, and build
        run: bash account-service/gradlew -p ride-management-service clean checkstyleMain checkstyleTest test jacocoTestReport build
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridelink-ride-management-coverage
          path: |
            ride-management-service/build/reports/jacoco/test/
            ride-management-service/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14
