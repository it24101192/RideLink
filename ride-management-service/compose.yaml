services:
  ride-postgres:
    image: postgres:16-alpine
    container_name: ridelink-ride-postgres
    environment:
      POSTGRES_DB: ridelink_ride_db
      POSTGRES_USER: ridelink
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - ride-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridelink -d ridelink_ride_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ride-postgres-data:
